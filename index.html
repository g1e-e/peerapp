<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>Peer Review App</title>
  <script>
    if (!new URLSearchParams(window.location.search).get("review")) window.location.replace("admin.html");
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f6e78'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <div class="layout">
    <section class="pane pane-form" aria-label="Peer review questionnaire">
      <header class="form-header">
        <div class="form-header-top">
          <h1>Peer Review App</h1>
        </div>
        <p>Answers are saved in this browser as you type.</p>
        <p id="review-banner" class="review-banner" hidden></p>
      </header>
      <form id="review-form" autocomplete="off"></form>
      <div class="actions" id="incident-actions" hidden>
        <button type="button" class="button button-secondary" id="add-incident">Add incident</button>
        <button type="button" class="button button-secondary" id="remove-incident">Remove incident</button>
      </div>
      <div class="actions">
        <button type="submit" class="button button-primary" id="submit-button" form="review-form">Submit</button>
        <button type="button" class="button button-secondary" id="clear-button">Clear</button>
      </div>
      <p id="submit-status" class="submit-status" role="status" hidden></p>
      <section id="summary" class="summary" hidden></section>
    </section>

    <aside class="pane pane-pdf" id="pdf-panel" aria-label="Reference PDF">
      <div class="pdf-frame" id="pdf-drop">
        <p class="pdf-message" id="pdf-message" role="alert" hidden></p>
        <div class="pdf-empty" id="pdf-empty">
          <h2>Reference PDF</h2>
          <p>Drop a PDF here, or choose a file.</p>
          <p class="pdf-hint">The file stays in this browser. Nothing is uploaded.</p>
          <p class="pdf-hint">Subjects should open the review link they were sent.</p>
          <button type="button" class="button button-primary" id="pdf-choose">Choose PDF</button>
        </div>
        <div class="pdf-viewer" id="pdf-viewer" hidden>
          <div class="pdf-toolbar">
            <p class="pdf-filename" id="pdf-filename"></p>
            <div class="pdf-toolbar-actions">
              <button type="button" class="button button-secondary" id="pdf-replace">Replace</button>
              <button type="button" class="button button-secondary" id="pdf-remove">Remove</button>
            </div>
          </div>
          <iframe id="pdf-frame" title="Reference PDF"></iframe>
        </div>
        <div id="review-view" hidden></div>
      </div>
      <div class="pdf-overlay" id="pdf-overlay" hidden>
        <p>Drop PDF here</p>
      </div>
      <input class="pdf-input" id="pdf-input" type="file" accept="application/pdf,.pdf" tabindex="-1" aria-hidden="true">
    </aside>
  </div>
  <script type="module" src="src/app.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const form = document.querySelector("#review-form");
      if (document.body.classList.contains("is-gated")) return;
      if (!form || form.childElementCount > 0) return;

      const note = document.createElement("p");
      note.className = "load-note";
      note.textContent = "The questions could not load. Browsers block JavaScript modules when this page is opened as a file. Serve the folder with a static server, or open the GitHub Pages site.";
      form.before(note);
    });
  </script>
</body>
</html>
